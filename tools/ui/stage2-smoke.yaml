appId: com.sonkkeut.uiupdate
name: Stage 2 real order entry and voice model controls
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "시작할 준비가 됐어요"
    timeout: 60000
- tapOn: "손끝길 시작"
- extendedWaitUntil:
    visible: "카메라 연결됨 · 영상 대기|촬영 중 · 화면 확인"
    timeout: 20000
- takeScreenshot: stage2-camera-actual
- tapOn: "직접 입력 주문"
- assertVisible: "입력한 주문 확인"
- tapOn: "음성 모델 준비"
- assertVisible: "자체 음성 모델"
- takeScreenshot: stage2-voice-model-actual
- tapOn: "닫기"
- assertVisible: "입력한 주문 확인"
- pressKey: Back
- tapOn: "종료"
- assertVisible: "손끝길 시작"
