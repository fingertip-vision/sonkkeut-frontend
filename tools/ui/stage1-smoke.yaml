appId: com.sonkkeut.uiupdate
name: Stage 1 real app entry and camera lifecycle
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "시작할 준비가 됐어요"
    timeout: 60000
- takeScreenshot: stage1-home
- tapOn: "손끝길 시작"
- extendedWaitUntil:
    visible: "카메라 연결됨 · 영상 대기|촬영 중 · 화면 확인"
    timeout: 20000
- takeScreenshot: stage1-camera
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "카메라 다시 시작"
- takeScreenshot: stage1-resume
- tapOn: "카메라 다시 시작"
- extendedWaitUntil:
    visible: "카메라 연결됨 · 영상 대기|촬영 중 · 화면 확인"
    timeout: 20000
- tapOn: "종료"
- assertVisible: "손끝길 시작"
- tapOn: "설정"
- assertVisible: "환경 설정"
- tapOn: "‹  메인 화면으로"
- assertVisible: "손끝길 시작"
